kind = "mobile"
previewPath = "/"
title = "UniPlanner"
description = "A teaching-grade university planning app for students, starting with a simple Week 1 mobile experience for viewing modules, tracking assessments, and checking a student profile."
version = "1.0.0"
id = "artifacts/uniplanner"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23937

[services.development]
run = "pnpm --filter @workspace/uniplanner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uniplanner", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/uniplanner", "run", "serve" ]

[services.env]
PORT = "23937"
BASE_PATH = "/"
